[project]
name = "uk-cable-route-engine"
version = "0.1.0"
description = "Automated cable route optimisation for UK grid connections: constraints -> least-cost corridors -> DXF + RAG report"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "geopandas>=1.0",
    "shapely>=2.0",
    "pyproj>=3.6",
    "pyogrio>=0.9",
    "rasterio>=1.3",
    "scikit-image>=0.22",
    "scipy>=1.11",
    "numpy>=1.26",
    "ezdxf>=1.3",
    "openpyxl>=3.1",
    "reportlab>=4.0",
    "matplotlib>=3.8",
    "requests>=2.31",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
postgis = ["sqlalchemy>=2.0", "geoalchemy2>=0.14", "psycopg2-binary>=2.9"]
dev = ["pytest>=8"]

[project.scripts]
routeengine = "routeengine.cli:main"

[tool.setuptools]
packages = ["routeengine"]

[tool.pytest.ini_options]
testpaths = ["tests"]
