name: ci

on:
  push:
  pull_request:

jobs:
  test:
    name: Tests (synthetic study area + PostGIS)
    runs-on: ubuntu-latest
    services:
      postgis:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_DB: routes
          POSTGRES_USER: routes
          POSTGRES_PASSWORD: routes
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U routes" --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      POSTGIS_URL: postgresql+psycopg2://routes:routes@localhost:5432/routes
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -e ".[dev,postgis]"
      - name: pytest
        shell: bash
        run: |
          set -o pipefail
          pytest -q -rs --tb=short 2>&1 | tee test.log
      - if: failure()
        run: python3 .github/scripts/annotate.py test.log
